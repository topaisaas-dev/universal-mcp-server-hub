name: "universal-mcp-server-hub"
title: "TopAI Universal Native MCP Server Hub"
description: >
  Universal Native Model Context Protocol (MCP) server hub providing 19 production-grade AI agent tools with sub-50ms serverless edge execution:
  Web-to-Markdown, B2B Leads, Company Deep-Enrichment, AI Web Search, Semantic Cache, Invoice Extractor, Headless Screenshot, Prompt Shield, TokenSlimmer, AgentVision Crop, Deterministic Math, TechStack Fingerprinter, Polymarket Arbitrage, MCP Hub Registry, PharmaPatent Watcher, Healthcare Validator, Google AI Overview, Disposable Email Shield, and OpenAPI Flattener.
homepage: "https://mcp-server-hub.topaisaas.workers.dev"
icon: "https://raw.githubusercontent.com/topaisaas-dev/universal-mcp-server-hub/main/logo.jpg"
repository: "https://github.com/topaisaas-dev/universal-mcp-server-hub"

configSchema:
  type: object
  properties:
    rapidApiKey:
      type: string
      description: "Optional RapidAPI Key for higher rate limits and quota. Leave blank for public free tier."
      secret: true

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      rapidApiKey:
        type: string
        description: "Optional RapidAPI Key for higher rate limits and quota. Leave blank for public free tier."
        secret: true
  command: "npx"
  args: ["-y", "@topaisaas/mcp-server"]
